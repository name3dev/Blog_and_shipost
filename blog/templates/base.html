
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyBlog{% endblock %}</title>

    <style>

/* =========================
   ОСНОВА САЙТА
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f1f4f8;
    color: #1c2939;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 15px;
}

a {
    color: inherit;
    text-decoration: none;
}

/* =========================
   ШАПКА
========================= */

.header {
    background: #14263d;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
    border-bottom: 3px solid #3879b9;
}

.logo {
    font-size: 27px;
    font-weight: 750;
    letter-spacing: 1.5px;
}

.navigation {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 25px;
}

.navigation a {
    color: #d4deea;
    font-size: 14px;
    transition: color 0.2s;
}

.navigation a:hover {
    color: #73baff;
}

.username {
    color: #8dbce8;
    font-size: 14px;
}

/* =========================
   ОСНОВНОЙ КОНТЕНТ
========================= */

.container {
    max-width: 1050px;
    margin: 45px auto;
    padding: 0 22px;
    min-height: 70vh;
}

.page-heading {
    margin-bottom: 30px;
}

.page-heading h1 {
    font-size: 34px;
    font-weight: 750;
    letter-spacing: -0.8px;
    color: #172d46;
    margin-bottom: 10px;
}

.page-heading h2 {
    font-size: 25px;
    color: #172d46;
}

.page-heading p {
    color: #78889b;
    margin: 0;
}

/* =========================
   КАРТОЧКИ
========================= */

.card {
    background: #ffffff;
    padding: 30px;
    margin-bottom: 24px;
    border: 1px solid #e1e7ef;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(24, 48, 76, 0.045);
    transition: box-shadow 0.25s, transform 0.25s;
}

.card:hover {
    box-shadow: 0 10px 28px rgba(24, 48, 76, 0.08);
}

/* =========================
   ПУБЛИКАЦИИ
========================= */

.post-title {
    margin: 0 0 14px;
    font-size: 25px;
    font-weight: 700;
    line-height: 1.35;
    color: #173b60;
}

.post-title a {
    transition: color 0.2s;
}

.post-title a:hover {
    color: #3789ce;
}

.meta {
    color: #8795a6;
    font-size: 13px;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid #edf0f4;
}

.post-content {
    font-size: 16px;
    line-height: 1.85;
    color: #425268;
    white-space: pre-wrap;
}

/* =========================
   ПОЛЯ ВВОДА
========================= */

input,
textarea {
    display: block;
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 17px;
    border: 1px solid #dce4ed;
    border-radius: 7px;
    background: #f9fbfd;
    color: #26384c;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: 0.2s;
}

input:focus,
textarea:focus {
    background: white;
    border-color: #4289c5;
    box-shadow: 0 0 0 3px rgba(66, 137, 197, 0.1);
}

textarea {
    min-height: 135px;
    resize: vertical;
}

/* =========================
   КНОПКИ
========================= */

button,
.button {
    display: inline-block;
    background: #205b91;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

button:hover,
.button:hover {
    background: #143f69;
    transform: translateY(-1px);
}

.button-secondary {
    background: #e8eef5;
    color: #294762;
}

.button-secondary:hover {
    background: #d9e4ef;
}

.button-danger {
    background: #b83d48;
}

.button-danger:hover {
    background: #942d37;
}

/* =========================
   ДЕЙСТВИЯ И РЕАКЦИИ
========================= */

.actions,
.reactions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 22px;
}

/* =========================
   КОММЕНТАРИИ
========================= */

.comments-preview {
    margin-top: 30px;
    padding-top: 23px;
    border-top: 2px solid #e8edf3;
}

.comments-preview h3 {
    font-size: 19px;
    color: #1b3856;
    margin: 0 0 18px;
}

.comment {
    position: relative;
    background: #f7f9fc;
    border: 1px solid #e6ebf1;
    border-left: 3px solid #347db5;
    border-radius: 5px;
    padding: 15px 18px;
    margin-bottom: 12px;
}

.comment strong {
    display: block;
    color: #24577f;
    font-size: 14px;
    margin-bottom: 8px;
}

.comment p {
    color: #43546a;
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 9px;
}

.comment small {
    color: #98a4b2;
    font-size: 12px;
}

.comments-preview .button {
    margin-top: 10px;
}

/* =========================
   АВТОРИЗАЦИЯ
========================= */

.auth-card {
    max-width: 450px;
    margin: 50px auto;
}

.auth-card h1 {
    margin-top: 0;
    color: #193b5d;
}

/* =========================
   СООБЩЕНИЯ
========================= */

.error {
    color: #a62e38;
    background: #fff0f1;
    border: 1px solid #f3d5d8;
    padding: 13px;
    border-radius: 6px;
}

.empty {
    text-align: center;
    color: #8492a2;
    padding: 35px;
}

hr {
    border: none;
    border-top: 1px solid #e6ebf1;
    margin: 27px 0;
}

/* =========================
   ПОДВАЛ
========================= */

.footer {
    text-align: center;
    padding: 28px;
    color: #8997a7;
    font-size: 13px;
    border-top: 1px solid #e1e7ef;
    background: #eaf0f6;
}

/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
========================= */

@media (max-width: 650px) {
    .header {
        padding: 18px 5%;
        justify-content: center;
    }

    .navigation {
        justify-content: center;
        gap: 15px;
    }

    .container {
        margin-top: 25px;
        padding: 0 14px;
    }

    .page-heading h1 {
        font-size: 27px;
    }

    .card {
        padding: 20px;
    }

    .post-title {
        font-size: 21px;
    }

    .post-content {
        font-size: 15px;
    }
    .comment {
    background: #f7f9fc;
    border: 1px solid #e3eaf2;
    border-left: 3px solid #347db5;
    border-radius: 6px;
    padding: 17px 20px;
    margin-bottom: 13px;
}

.comment strong {
    display: block;
    color: #24577f;
    margin-bottom: 8px;
}

.comment p {
    color: #43546a;
    line-height: 1.7;
}

.comment small {
    color: #8999aa;
    font-size: 12px;
}
}

    </style>
</head>

<body>

<header class="header">
    <a href="{% url 'home' %}" class="logo">MyBlog.</a>

    <nav class="navigation">
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'posts' %}">Все посты</a>

        {% if user.is_authenticated %}
            <a href="{% url 'home' %}#create-post">Написать пост</a>
            <span class="username">{{ user.username }}</span>
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

<footer class="footer">
    MyBlog. Все публикации в одном месте.
</footer>

</body>
</html>
